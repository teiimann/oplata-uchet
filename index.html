<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12223b">
  <meta name="description" content="YET — учёт ежемесячных счетов и поступлений">
  <title>YET — учёт счетов</title>
  <link rel="icon" type="image/png" href="wolf-mark.png">
  <link rel="apple-touch-icon" href="wolf-mark.png">
  <link rel="stylesheet" href="styles.css?v=3">
  <script src="app.js?v=4" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"><img src="wolf-mark.png" width="39" height="39" alt=""></span><span>YET</span></div>
      <span class="topbar-note">Учёт поступлений</span>
    </header>
    <main id="main" tabindex="-1"></main>
    <nav class="bottom-nav" aria-label="Основная навигация">
      <button type="button" data-view="overview" class="nav-button"><span aria-hidden="true">◫</span>Обзор</button>
      <button type="button" data-view="clients" class="nav-button"><span aria-hidden="true">♧</span>Плательщики</button>
      <button type="button" data-view="history" class="nav-button"><span aria-hidden="true">▤</span>История</button>
      <button type="button" data-view="settings" class="nav-button"><span aria-hidden="true">⚙</span>Данные</button>
    </nav>
  </div>
  <dialog id="modal"><div id="modal-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <input id="import-file" type="file" accept="application/json,.json" hidden>
</body>
</html>
